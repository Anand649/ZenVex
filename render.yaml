# Render blueprint (verify current free-tier terms on render.com before relying on it).
services:
  - type: web
    name: zenvex-guard
    runtime: python
    buildCommand: >-
      python -m pip install -r backend/requirements.txt &&
      npm --prefix frontend ci --include=dev &&
      npm --prefix frontend run build
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ZENVEX_CORS_ORIGINS
        value: ""
